on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      osx_target:
        required: true
        type: string

env:
  PREFIX: "${{ github.workspace }}/build/usr"

jobs:
  opus-tools:
    runs-on: macos-latest

    steps:

    ##################################
    #
    - name: prepare
      run: |
        if [ "${{ inputs.arch }}" = "x86_64" ]; then
          export "HOST=x86_64-apple-darwin"
        elif [ "${{ inputs.arch }}" = "arm64" ]; then
          export "HOST=aarch64-apple-darwin"
        fi
        echo "HOST=${HOST}" >> $GITHUB_ENV

        export


    ##################################
    #
    - name: Build libopus
      shell: bash
      env:
        VERSION: "1.6.1"
      run: |
        mkdir -p libopus
        curl -sSL "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-${{env.VERSION}}.tar.gz" | tar xz --strip-components=1 -C libopus
        cd libopus

        ./configure \
          --host="${{ env.HOST }}" \
          --prefix="${{ env.PREFIX }}" \
          --disable-doc \
          --enable-static \
          --disable-shared \
          PKG_CONFIG_PATH="${{ env.PREFIX }}/lib/pkgconfig" \
          CPPFLAGS="-I${{ env.PREFIX }}/include" \
          CFLAGS="-arch ${{ inputs.arch }} -mmacosx-version-min=${{ inputs.osx_target }} -Wno-implicit-function-declaration" \
          LDFLAGS="-L${{ env.PREFIX }}/lib -arch ${{ inputs.arch }}"

        make -j$(sysctl -n hw.ncpu)
        make install


    ##################################
    #
    - name: Build libogg
      shell: bash
      env:
        VERSION: "1.3.5"
      run: |
        mkdir -p libogg
        curl -sSL https://downloads.xiph.org/releases/ogg/libogg-${{env.VERSION}}.tar.gz | tar xz --strip-components=1 -C libogg
        cd libogg

        ./configure \
          --host="${{ env.HOST }}" \
          --prefix="${{ env.PREFIX }}" \
          --enable-static \
          --disable-shared \
          PKG_CONFIG_PATH="${{ env.PREFIX }}/lib/pkgconfig" \
          CFLAGS="-arch ${{ inputs.arch }} -mmacosx-version-min=${{ inputs.osx_target }}" \
          LDFLAGS="-arch ${{ inputs.arch }}"

        make -j$(sysctl -n hw.ncpu)
        make install


    ##################################
    #
    - name: Build opusfile
      shell: bash
      env:
        VERSION: "0.12"
      run: |
        mkdir -p opusfile
        curl -sSL https://ftp.osuosl.org/pub/xiph/releases/opus/opusfile-${{env.VERSION}}.tar.gz | tar xz --strip-components=1 -C opusfile
        cd opusfile

        ./configure \
          --host="${{ env.HOST }}" \
          --prefix="${{ env.PREFIX }}" \
          --enable-static \
          --disable-shared \
          --disable-http \
          PKG_CONFIG_PATH="${{ env.PREFIX }}/lib/pkgconfig" \
          CFLAGS="-arch ${{ inputs.arch }} -mmacosx-version-min=${{ inputs.osx_target }}" \
          LDFLAGS="-arch ${{ inputs.arch }}"

        make -j$(sysctl -n hw.ncpu)
        make install


    # ##################################
    # #
    - name: Build libopusenc
      shell: bash
      env:
        VERSION: "0.3"
      run: |
        mkdir -p libopusenc
        curl -sSL "https://ftp.osuosl.org/pub/xiph/releases/opus/libopusenc-${{env.VERSION}}.tar.gz" | tar xz --strip-components=1 -C libopusenc
        cd libopusenc

        ./configure \
          --host="${{ env.HOST }}" \
          --prefix="${{ env.PREFIX }}" \
          --enable-static \
          --disable-shared \
          PKG_CONFIG_PATH="${{ env.PREFIX }}/lib/pkgconfig" \
          CPPFLAGS="-I${{ env.PREFIX }}/include" \
          CFLAGS="-arch ${{ inputs.arch }} -mmacosx-version-min=${{ inputs.osx_target }} -Wno-implicit-function-declaration" \
          LDFLAGS="-L${{ env.PREFIX }}/lib -arch ${{ inputs.arch }}"

        make -j$(sysctl -n hw.ncpu)
        make install


    ##################################
    #
    - name: Build flac
      shell: bash
      env:
        VERSION: "1.5.0"
      run: |
        git clone --depth 1 https://github.com/xiph/flac.git --branch ${{ env.VERSION }} flac || true
        cd flac
        cmake -S flac -B flac/build \
          -DCMAKE_INSTALL_PREFIX="${{ env.PREFIX }}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=${{ inputs.arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ inputs.osx_target }} \
          -DBUILD_PROGRAMS=ON \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_TESTING=OFF \
          -DBUILD_DOCS=OFF \
          -DBUILD_CXXLIBS=OFF \
          -DINSTALL_MANPAGES=OFF \
          -DCMAKE_DISABLE_FIND_PACKAGE_Intl=TRUE \
          -DWITH_OGG=OFF \
          -Bbuild \
          .

        cmake --build build -j$(sysctl -n hw.ncpu)
        cmake --install build


    ##################################
    #
    - name: Build opus-tools
      shell: bash
      env:
        VERSION: "0.2"
      run: |
        mkdir -p opus-tools
        curl -sSL "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-tools-${{ env.VERSION }}.tar.gz" | tar xz --strip-components=1 -C opus-tools
        cd opus-tools

        # ./autogen.sh

        ./configure \
          --host="${{ env.HOST }}" \
          --prefix="${{ env.PREFIX }}" \
          --enable-static \
          --disable-shared \
          PKG_CONFIG_PATH="${{ env.PREFIX }}/lib/pkgconfig" \
          CPPFLAGS="-I${{ env.PREFIX }}/include" \
          CFLAGS="-arch ${{ inputs.arch }} -mmacosx-version-min=${{ inputs.osx_target }} -Wno-implicit-function-declaration" \
          LDFLAGS="-L${{ env.PREFIX }}/lib -arch ${{ inputs.arch }}"

        make -j$(sysctl -n hw.ncpu)
        make install


    ##################################
    #
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ext-${{ github.job }}-${{ inputs.arch }}
        path: |
          ${{ env.PREFIX }}/bin/opusenc
